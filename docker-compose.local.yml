# Separate persistent development database; existing database remains untouched.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: carrent_tn
      POSTGRES_USER: carrent_tn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run tools/local.py configure first}
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-55432}:5432"
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carrent_tn -d carrent_tn"]
      interval: 3s
      timeout: 3s
      retries: 25
volumes:
  local_postgres_data:
