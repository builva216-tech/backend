services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: carrent_tn
      POSTGRES_USER: carrent_tn
      POSTGRES_PASSWORD: carrent_tn
    ports:
      - "5432:5432"
    volumes:
      - carrent_tn_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carrent_tn -d carrent_tn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carrent_tn_postgres_data:
